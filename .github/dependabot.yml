version: 2
# Add the `npm` (/frontend) entry in the scaffold PR that creates that folder.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      # Dependabot appends ": " to the prefix, giving "ci (deps): bump ...".
      prefix: ci (deps)
    labels:
      - type:chore
      - area:infra
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: build (deps)
    labels:
      - type:chore
      - area:backend
