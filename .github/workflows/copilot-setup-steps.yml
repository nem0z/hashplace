name: Copilot Setup Steps

# Prepares the environment for the Copilot cloud agent.
# Runs automatically when this file changes so it can be validated in PRs.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` to be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: false

      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.14.0

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Download Go modules
        if: hashFiles('backend/go.mod') != ''
        working-directory: backend
        run: go mod download

      - name: Install web dependencies
        if: hashFiles('web/package-lock.json') != ''
        working-directory: web
        run: npm ci
