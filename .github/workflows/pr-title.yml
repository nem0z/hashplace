name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: conventional-title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            test
            docs
            build
            ci
            chore
            revert
          scopes: |
            backend
            frontend
            protocol
            ci
            docs
            agents
            deps
          requireScope: false
          # Format: "type (scope): description". The space before "(scope)" is required.
          headerPattern: '^(\w+)(?: \(([\w-]+)\))?!?: (.+)$'
          headerPatternCorrespondence: type, scope, subject
          subjectPattern: ^(?![A-Z]).+[^.]$
          subjectPatternError: |
            The subject "{subject}" must start with a lower-case letter and must not end with a period.
